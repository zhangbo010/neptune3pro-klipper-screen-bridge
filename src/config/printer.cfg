# [filament_switch_sensor filament_sensor]
# pause_on_runout: True
# switch_pin: PB4

# ---------------- 温度监控 (Sensors) ----------------

[temperature_sensor MKS_Pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 105

[temperature_sensor MCU_STM32F401]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 105

[force_move]
enable_force_move: True
