# Elegoo Neptune 3 Pro (ZNP Robin Nano_DW V2.2 / STM32F401RCT6)
# 固件通讯接口：USART2 (PA3/PA2 = 主板 J17) <-> MKS Pi UART0 (/dev/ttyS0)
# 屏幕通讯接口：USART6 (PA12/PA11 = 主板 J33) 桥接至上位机 PTY /tmp/ttyTJC (115200)

[include mainsail.cfg]
[include plr.cfg]

[mcu]
serial: /dev/ttyS0
baud: 250000
restart_method: command

[screen_bridge]
pty: /tmp/ttyTJC
baud: 115200

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity: 5.0

[exclude_object]

[virtual_sdcard]
path: /home/klipper/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]
[display_status]
[respond]

# ---------------- 步进电机 (Steppers) ----------------

[stepper_x]
step_pin: !PC12
dir_pin: PB3
enable_pin: !PD2
microsteps: 16
rotation_distance: 40
endstop_pin: PA13
position_min: -5
position_endstop: -5
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PC11
dir_pin: PA15
enable_pin: !PC10
microsteps: 16
rotation_distance: 40
endstop_pin: PB8
position_endstop: 0
position_max: 234
homing_speed: 50

[stepper_z]
step_pin: PC7
dir_pin: !PC9
enable_pin: !PC8
microsteps: 16
rotation_distance: 8
position_min: -2.0
position_max: 280
endstop_pin: PB4
homing_speed: 8
second_homing_speed: 3
position_endstop: 0

# ---------------- 挤出机与热床 (Extruder & Bed) ----------------

[extruder]
step_pin: PB10
dir_pin: PB1
enable_pin: !PC6
microsteps: 16
rotation_distance: 7.53
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PA6
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
control: pid
pid_Kp: 26.27
pid_Ki: 1.607
pid_Kd: 107.380
min_temp: -100
max_temp: 260
max_extrude_only_distance: 100.0

[heater_bed]
heater_pin: PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
control: pid
pid_Kp: 70.173
pid_Ki: 1.418
pid_Kd: 868.388
min_temp: -100
max_temp: 110

# ---------------- 风扇与灯光 (Fans & LED) ----------------

# FAN1 (PB0): 电器仓风扇（与喉管散热风扇同步开启）
[heater_fan controller_fan]
pin: PB0
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

# FAN2 (PA7): 喉管散热风扇（喷头超过 50°C 自动全速开启）
[heater_fan hotend_fan]
pin: PA7
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

# 占位 [fan] 对象（供 KlipperLCD 屏幕服务读取状态，占用主板未引出的空闲脚 PB2）
[fan]
pin: PB2

[led top_LEDs]
white_pin: PB9
cycle_time: 0.005
initial_white: 1.0

# ---------------- 探针、断料检测与调平 (Probe & Mesh) ----------------

# [probe]
# pin: ^PA8
# speed: 5
# lift_speed: 15
# samples: 2
# x_offset: -28.5
# y_offset: 22.0
# z_offset: 1.000

[safe_z_home]
home_xy_position: 146.0, 95.5
speed: 80
z_hop: 10
z_hop_speed: 10

